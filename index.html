<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CPM BANK</title>
  <style>
    *{box-sizing:border-box} body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:#f4f7fb;color:#10233f}
    nav{height:72px;background:#06284d;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 6%;position:sticky;top:0}
    .brand{font-size:25px;font-weight:800;letter-spacing:.5px}.brand span{color:#2d9cff}
    nav a{color:#fff;text-decoration:none;margin-left:28px;font-size:15px}
    .hero{max-width:1200px;margin:28px auto;padding:0 20px}.hero img{width:100%;display:block;border-radius:22px;box-shadow:0 18px 50px rgba(10,45,80,.16)}
    .cards{max-width:1200px;margin:28px auto 50px;padding:0 20px;display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
    .card{background:#fff;border:1px solid #e2eaf4;border-radius:18px;padding:25px;box-shadow:0 8px 25px rgba(20,50,90,.06)}
    .icon{font-size:30px}.card h3{margin:12px 0 8px}.card p{margin:0;color:#61718a;line-height:1.6}
    footer{text-align:center;padding:24px;background:#06284d;color:#cbd8e8;font-size:14px}
    @media(max-width:750px){nav{padding:0 20px}nav a{display:none}.cards{grid-template-columns:1fr}.hero{margin-top:16px}}
  </style>
</head>
<body>
  <nav>
    <div class="brand">CPM <span>BANK</span></div>
    <div><a href="#">Home</a><a href="#">Accounts</a><a href="#">Cards</a><a href="#">Transfers</a></div>
  </nav>

  <main>
    <section class="hero">
      <img src="cpm-bank.png" alt="CPM BANK">
    </section>

    <section class="cards">
      <div class="card"><div class="icon">💳</div><h3>Cards</h3><p>Simple, secure access to your everyday banking.</p></div>
      <div class="card"><div class="icon">💸</div><h3>Transfers</h3><p>Move money quickly with a clean and simple experience.</p></div>
      <div class="card"><div class="icon">🛡️</div><h3>Security</h3><p>Your banking experience is designed with security in mind.</p></div>
    </section>
  </main>

  <footer>© 2026 CPM BANK — Demo Application</footer>
</body>
</html>
