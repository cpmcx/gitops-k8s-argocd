apiVersion: v1
kind: Secret
metadata:
  name: jira-db-secret
  namespace: jira
type: Opaque
stringData:
  username: jira
  password: JiraDB@12345
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jira-postgres-pvc
  namespace: jira
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jira-postgres
  namespace: jira
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jira-postgres
  template:
    metadata:
      labels:
        app: jira-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: jiradb
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: jira-db-secret
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jira-db-secret
                  key: password
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: jira-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: jira-postgres
  namespace: jira
spec:
  selector:
    app: jira-postgres
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
