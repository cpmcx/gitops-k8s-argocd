apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jira-postgres
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/cpmcx/gitops-k8s-argocd.git
    targetRevision: main
    path: jira
    directory:
      include: postgres.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: jira

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
