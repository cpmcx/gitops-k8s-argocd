apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik-routes
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/cpmcx/gitops-k8s-argocd.git
    targetRevision: main
    path: traefik

  destination:
    server: https://kubernetes.default.svc
    namespace: odoo

  syncPolicy:
    automated:
      prune: true
      selfHeal: true